[project]
name = "azimuth"
version = "0.1.0"
description = "AZIMUTH — composite trading-signal engine and validation harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Stack fixed by docs/04_SPEC_PYTHON_CLI.md section 2.
#
# pandas_ta and TA-Lib are BANNED (CLAUDE.md rule 6, docs/04 section 2): their
# EMA/RSI seeding differs from Pine's and would silently break parity. Indicator
# maths is implemented in-repo in azimuth/core/primitives.py.
# tests/test_no_banned_deps.py enforces this.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "ccxt>=4.3",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
]

[project.scripts]
azimuth = "azimuth.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["azimuth"]

[tool.ruff]
line-length = 100
target-version = "py311"

# docs/ and pine/ are authoritative specification, not source. `ruff format`
# reformats Python snippets inside markdown fences, which silently edits the
# specs -- and docs/09_PREREGISTRATION.md is SHA-256 pinned, so a whitespace
# change there would invalidate a registration. Never let the formatter near them.
extend-exclude = ["docs", "pine"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
    "ANN",  # annotations — parity code must be fully typed
    "TID",  # tidy imports
]
ignore = [
    "ANN401",  # Any is occasionally unavoidable at IO boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

# --strict is applied on the command line to azimuth/core and azimuth/validate
# only (docs/10_ROADMAP.md M1, CLAUDE.md working style). Those two packages are
# the parity- and statistics-critical surface.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "parity: requires a committed Pine fixture export (docs/06_PARITY_TESTS.md)",
]
